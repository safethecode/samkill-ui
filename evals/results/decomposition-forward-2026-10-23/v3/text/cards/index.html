<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이력서 관리</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #FFFFFF;
      --card: #F5F5F8;
      --green: #02DD6D;
      --red: #FE5467;
      --main: #111112;
      --support: #444445;
      --muted: #A2A2A2;
      --help: #C7CFC9;
      --border: #E2E4E3;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 100%;
      background: var(--canvas);
    }

    body {
      margin: 0;
      min-inline-size: 0;
      background: var(--canvas);
      color: var(--main);
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--main);
      outline-offset: 3px;
    }

    .resume-panel {
      inline-size: 100%;
      min-block-size: 355px;
      padding: 36.875px 45px 45px;
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .panel-heading {
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 8.125px 0 0;
      color: var(--main);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .import-button {
      flex: 0 1 auto;
      inline-size: max(181.25px, 11.328125rem);
      max-inline-size: 100%;
      min-block-size: 43.75px;
      margin-inline-start: auto;
      padding: 9.875px 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--main);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.375;
      overflow-wrap: anywhere;
    }

    .resume-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
      gap: 18.125px;
      margin-block-start: 21.875px;
    }

    .resume-card,
    .add-card {
      min-inline-size: 0;
      min-block-size: 203.125px;
      padding: 24px;
      border: 0;
      border-radius: 15px;
      background: var(--card);
    }

    .resume-card {
      display: flex;
      flex-direction: column;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      min-inline-size: 0;
      margin: 0;
      color: var(--main);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .icon {
      display: inline-block;
      flex: 0 0 auto;
      inline-size: 20px;
      block-size: 20px;
      background: currentColor;
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;
    }

    .menu-button {
      display: flex;
      flex: 0 0 20px;
      align-items: center;
      justify-content: center;
      inline-size: 20px;
      block-size: 28px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
    }

    .menu-icon {
      mask-image: url("assets/icons/EllipsisVertical.svg");
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      color: var(--support);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.4285714286;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      min-inline-size: 0;
      overflow-wrap: anywhere;
    }

    .status-dot {
      flex: 0 0 6px;
      inline-size: 6px;
      block-size: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .private-card .status-dot {
      background: var(--red);
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-block-start: auto;
      padding-block-start: 16px;
      color: var(--support);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.4285714286;
    }

    .visibility-group {
      display: flex;
      align-items: center;
      gap: 4px;
      min-inline-size: 0;
    }

    .visibility-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-inline-size: 0;
      cursor: pointer;
    }

    .switch-shell {
      display: block;
      flex: 0 0 30px;
      inline-size: 30px;
      block-size: 18px;
      border-radius: 9px;
      background: var(--border);
      transition: background-color 120ms ease, box-shadow 120ms ease;
    }

    .switch-shell:has(input:checked) {
      background: var(--green);
    }

    .switch-shell:focus-within {
      box-shadow: inset 0 0 0 2px var(--main);
    }

    .visibility-switch {
      display: block;
      inline-size: 30px;
      block-size: 18px;
      margin: 0;
      padding: 2px;
      border: 0;
      border-radius: 9px;
      outline: none;
      background: transparent;
      cursor: pointer;
      appearance: none;
    }

    .visibility-switch::before {
      display: block;
      inline-size: 14px;
      block-size: 14px;
      border-radius: 50%;
      background: var(--canvas);
      content: "";
      transition: transform 120ms ease;
    }

    .visibility-switch:checked::before {
      transform: translateX(12px);
    }

    .help-icon {
      inline-size: 16px;
      block-size: 16px;
      color: var(--help);
      mask-image: url("assets/icons/CircleHelp.svg");
    }

    .card-date {
      min-inline-size: 0;
      margin-inline-start: auto;
      color: var(--muted);
      text-align: end;
      overflow-wrap: anywhere;
    }

    .add-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--support);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .add-circle {
      display: flex;
      flex: 0 0 36px;
      align-items: center;
      justify-content: center;
      inline-size: 36px;
      block-size: 36px;
      border-radius: 50%;
      background: var(--green);
      color: var(--canvas);
    }

    .plus-icon {
      mask-image: url("assets/icons/Plus.svg");
    }

    .add-label {
      max-inline-size: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-shell,
      .visibility-switch::before {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      .switch-shell {
        outline: 1px solid ButtonText;
      }

      .switch-shell:focus-within {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }

      .visibility-switch::before {
        background: ButtonText;
      }

      .icon {
        background: ButtonText;
      }
    }
  </style>
</head>
<body>
  <section class="resume-panel" data-eid="E-panel" aria-labelledby="resume-heading">
    <header class="panel-header">
      <h1 class="panel-heading" id="resume-heading" data-eid="E-heading">이력서 관리</h1>
      <button class="import-button" type="button" data-eid="E-import">사람인 이력서 가져오기</button>
    </header>

    <div class="resume-grid" data-eid="E-grid">
      <article class="resume-card" data-eid="E-card1" aria-labelledby="resume-title-1">
        <div class="title-row">
          <h2 class="card-title" id="resume-title-1">유아이볼이력서_1차</h2>
          <button class="menu-button" type="button" aria-label="유아이볼이력서_1차 메뉴">
            <span class="icon menu-icon" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="status-row">
          <li class="status-item"><span>기술스택</span><span class="status-dot" aria-hidden="true"></span></li>
          <li class="status-item"><span>학력</span><span class="status-dot" aria-hidden="true"></span></li>
          <li class="status-item"><span>경력/프로젝트</span><span class="status-dot" aria-hidden="true"></span></li>
        </ul>

        <div class="card-footer">
          <div class="visibility-group">
            <label class="visibility-label" for="resume-public-1">
              <span class="switch-shell"><input class="visibility-switch" id="resume-public-1" name="resume-public-1" type="checkbox" role="switch" checked></span>
              <span>공개</span>
            </label>
            <span class="icon help-icon" role="img" aria-label="공개 도움말"></span>
          </div>
          <time class="card-date" datetime="2026-06-02">2026.06.02 등록</time>
        </div>
      </article>

      <article class="resume-card private-card" data-eid="E-card2" aria-labelledby="resume-title-2">
        <div class="title-row">
          <h2 class="card-title" id="resume-title-2">유아이볼이력서_2차</h2>
          <button class="menu-button" type="button" aria-label="유아이볼이력서_2차 메뉴">
            <span class="icon menu-icon" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="status-row">
          <li class="status-item"><span>기술스택</span><span class="status-dot" aria-hidden="true"></span></li>
          <li class="status-item"><span>학력</span><span class="status-dot" aria-hidden="true"></span></li>
          <li class="status-item"><span>경력/프로젝트</span><span class="status-dot" aria-hidden="true"></span></li>
        </ul>

        <div class="card-footer">
          <div class="visibility-group">
            <label class="visibility-label" for="resume-public-2">
              <span class="switch-shell"><input class="visibility-switch" id="resume-public-2" name="resume-public-2" type="checkbox" role="switch"></span>
              <span>비공개</span>
            </label>
            <span class="icon help-icon" role="img" aria-label="비공개 도움말"></span>
          </div>
          <time class="card-date" datetime="2026-06-02">2026.06.02 등록</time>
        </div>
      </article>

      <button class="add-card" type="button" data-eid="E-add">
        <span class="add-circle" aria-hidden="true"><span class="icon plus-icon"></span></span>
        <span class="add-label">새로운 이력서를 추가해보세요!</span>
      </button>
    </div>
  </section>
</body>
</html>
